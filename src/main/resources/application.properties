spring.application.name=InfyMeDigitalBanking_Accounts
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/infyme_digital_banking
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.messages.basename=messages,ValidationMessages

logging.file.name=logs/infyme-digital-banking-accounts.log
