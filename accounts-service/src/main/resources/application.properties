spring.application.name=accounts-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/infyme_digital_banking
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.messages.basename=messages,ValidationMessages

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

logging.file.name=logs/accounts-service.log
